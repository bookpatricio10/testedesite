<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <section>
            <h1>Lista de Checagem</h1>

            <form action="">
                <div>
                    <input type="checkbox" name="1" id="1">
                    <label for="1">Conhecimento sólido em lógica de programação e desenvolvimento web back-end (projetos pessoais, acadêmicos ou experiências anteriores);</label>
                </div>

                <div>
                    <input type="checkbox" name="2" id="2">
                    <label for="2">Conhecimento em Node.js com foco no framework NestJS;</label>
                </div>

                <div>
                    <input type="checkbox" name="3" id="3">
                    <label for="3">Conhecimento em bancos de dados relacionais (PostgreSQL ou MySQL);</label>
                </div>

                <div>
                    <input type="checkbox" name="4" id="4">
                    <label for="4">Familiaridade com Docker para execução de ambientes de desenvolvimento isolados;</label>
                </div>

                <div>
                    <input type="checkbox" name="5" id="5">
                    <label for="5">Interesse genuíno em aplicar padrões de projeto (Design Patterns), princípios SOLID e escrever testes automatizados;</label>
                </div>

                <div>
                    <input type="checkbox" name="6" id="6">
                    <label for="6">Entendimento dos fundamentos de arquitetura web: Protocolo HTTP, APIs RESTful;</label>
                </div>

                <div>
                    <input type="checkbox" name="7" id="7">
                    <label for="7">Boa comunicação interpessoal para interagir com diferentes áreas e clareza para expor dificuldades técnicas;</label>
                </div>

                <div>
                    <input type="checkbox" name="8" id="8">
                    <label for="8">Proatividade e perfil analítico para investigar problemas de forma autônoma antes de escalar.</label>
                </div>

                <div>
                    <input type="checkbox" name="9" id="9">
                    <label for="9">apresente detalhadamente um projeto para apresentar a empresa que passe a mensagem de que o candidato dá conta do serviço para a vaga.</label>
                </div>

                <button id="atualizar" disabled style="display: none;">Atualizar Contagem</button>
            </form>
        </section>
    </main>

    <script>
        const checksArray = ["1", "2", "3", "4", "5", "6", "7", "8", "9"];
        
        let contador = 0;

        checksArray.forEach((check) => {
            let checkElementValue = document.getElementById(check);

            if (checkElementValue.checked) {
                contador++;                
            }
        });
        document.writeln(`<br><br>`);
        document.writeln(`<p>Concluídos: ${contador}</p>`);
        document.writeln(`<p>Restam: ${9-contador}</p>`);

        function atualizar() {
            location.reload();
        }

        addEventListener('click', atualizar);
    </script>
</body>
</html>
